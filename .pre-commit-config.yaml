# Install once with: uv run pre-commit install
# Hooks run the project's own pinned tools through uv, so versions live in uv.lock only.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
      # Frontend: the same checks as CI's frontend job, only when frontend files change.
      # Needs `npm ci` in frontend/ once.
      - id: frontend-lint
        name: frontend lint (oxlint)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck (tsc)
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-test
        name: frontend tests (vitest)
        entry: npm --prefix frontend test
        language: system
        files: ^frontend/
        pass_filenames: false