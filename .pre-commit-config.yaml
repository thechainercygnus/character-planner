# Install once with: uv run pre-commit install (installs the commit and push hooks)
# Hooks run the project's own pinned tools through uv, so versions live in uv.lock only,
# except Semgrep's, which matches CI's.
default_install_hook_types: [pre-commit, pre-push]
# Hooks run at commit unless they say otherwise: the push hooks below opt in.
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
      # Frontend: the same checks as CI's frontend job, only when frontend files change.
      # Needs `npm ci` in frontend/ once.
      - id: frontend-lint
        name: frontend lint (oxlint)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-typecheck
        name: frontend typecheck (tsc)
        entry: npm --prefix frontend run typecheck
        language: system
        files: ^frontend/
        pass_filenames: false
      - id: frontend-test
        name: frontend tests (vitest)
        entry: npm --prefix frontend test
        language: system
        files: ^frontend/
        pass_filenames: false
      # Before a push (#57): the custom Semgrep rules, as CI's semgrep job runs them, so a
      # finding shows up before CI. The version must match SEMGREP in
      # .github/workflows/semgrep.yml (tests/test_hooks.py checks it).
      - id: semgrep-rules
        name: semgrep (custom rules)
        entry: uvx --from semgrep==1.185.0 semgrep scan --metrics=off --error --quiet --config .semgrep/rules src
        language: system
        files: ^(src/|\.semgrep/)
        pass_filenames: false
        stages: [pre-push]
      - id: semgrep-rule-tests
        name: semgrep (the rules' own tests)
        entry: uvx --from semgrep==1.185.0 semgrep --test --metrics=off --config .semgrep/rules .semgrep/tests
        language: system
        files: ^\.semgrep/
        pass_filenames: false
        stages: [pre-push]
