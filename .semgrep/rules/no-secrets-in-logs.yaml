# CLAUDE.md: "Never log or print access tokens or the client secret" (#57).
# A taint rule: a token or the client secret must not reach a log call, print, or an
# exception's message, unless it passes through logs.redact first.
# Test: uvx --from semgrep semgrep --test --config .semgrep/rules .semgrep/tests
rules:
  - id: no-secrets-in-logs
    languages: [python]
    severity: ERROR
    message: >-
      A token or the client secret reaches a log call, print, or an exception message.
      Those must never carry them (CLAUDE.md). Log a fact about it instead (that it exists,
      when it expires), or pass the text through logs.redact.
    metadata:
      category: security
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      confidence: HIGH
      references:
        - https://github.com/thechainercygnus/character-planner/issues/57
    mode: taint
    pattern-sources:
      # The Battle.net client secret is a SecretStr (config.py): its value is a secret.
      - pattern: $SECRET.get_secret_value()
      # OAuth tokens (oauth.Token, StoredToken) carry the token in access_token.
      - pattern: $TOKEN.access_token
      - pattern: $TOKEN.refresh_token
    pattern-sinks:
      # logging.info(...), logger.warning(...), log.exception(...) and the like.
      - patterns:
          - pattern-either:
              - pattern: logging.$LEVEL(...)
              - pattern: $LOGGER.$LEVEL(...)
          - metavariable-regex:
              metavariable: $LEVEL
              regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log)$
      - pattern: print(...)
      # A raised exception's message: it reaches logs and, for some, API responses.
      - patterns:
          - pattern-inside: raise $EXC(...)
          - pattern: $EXC(...)
    pattern-sanitizers:
      - pattern: redact(...)
      - pattern: $LOGS.redact(...)
      # Facts about a secret, not the secret.
      - pattern: len(...)
      - pattern: bool(...)
