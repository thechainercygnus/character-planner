# Shaman defaults (#80, ADR 0023): used when the synced character is a Shaman, and in
# guest mode. Edits made in the app (Upgrades settings, Stat weights, Edit targets, the
# talent planner) are saved in the database and win until reset.

name: Shaman

# What a Shaman can wear and wield. Proficiencies as in Classic: Forever's own data
# doesn't list proficiencies, so correct anything here that Forever changed.
# Values match Forever Companion's item details (weaponType, armor class).
rules:
  weapon_types: [Axe, Mace, Dagger, Fist Weapon, Staff, Shield]
  armor_types: [cloth, leather]
  plate_from_level: null
  # Mail from 40, as in Classic.
  mail_from_level: 40
  # Enhancement levels with a two-hander; no two-handed swords or polearms.
  two_handers: true
  two_hand_types: [Axe, Mace, Staff]
  # No dual wielding in Classic: shields and held-in-off-hand items.
  off_hand_types: [Shield, Miscellaneous]

# Stat weights: rough starting points, not theorycraft. Adjust them in the app.
# Stat names are as Forever writes them, including equip bonuses ("Equip: +5 Spell Power").
# The first preset is the default; the others only list what they change.
presets:
  # Enhancement: a slow two-hander and Windfury.
  - key: shaman-leveling
    name: Leveling enhancement
    weights:
      Strength: 1.0
      Agility: 0.6
      Attack Power: 0.5
      Stamina: 0.6
      Intellect: 0.3
      Spirit: 0.1
      Weapon DPS: 3.0
      Armor: 0.03
      Defense: 0.1
      Ranged DPS: 0.0
      Spell Damage: 0.1
      Spell Power: 0.1
      Nature Spell Damage: 0.1
      Fire Spell Damage: 0.05
      Frost Spell Damage: 0.05
      Healing: 0.1
      Mana Regeneration: 0.2
      Fire Resistance: 0.05
      Frost Resistance: 0.05
      Nature Resistance: 0.05
      Shadow Resistance: 0.05
      Arcane Resistance: 0.05
  - key: shaman-caster
    name: Dungeon caster
    weights:
      Spell Damage: 1.0
      Spell Power: 1.0
      Nature Spell Damage: 0.8
      Intellect: 0.7
      Spirit: 0.2
      Mana Regeneration: 0.8
      Stamina: 0.4
      Strength: 0.0
      Agility: 0.0
      Attack Power: 0.0
      Weapon DPS: 0.0
  - key: shaman-healer
    name: Dungeon healer
    weights:
      Healing: 1.0
      Spell Power: 0.8
      Spell Damage: 0.1
      Nature Spell Damage: 0.0
      Intellect: 0.8
      Spirit: 0.3
      Mana Regeneration: 1.0
      Stamina: 0.3
      Strength: 0.0
      Agility: 0.0
      Attack Power: 0.0
      Weapon DPS: 0.0

# No curated gear targets or talent plan yet: build them in the app's editors.
targets: []
