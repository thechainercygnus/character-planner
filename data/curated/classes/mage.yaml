# Mage defaults (#80, ADR 0023): used when the synced character is a Mage, and in guest
# mode. Edits made in the app (Upgrades settings, Stat weights, Edit targets, the talent
# planner) are saved in the database and win until reset.

name: Mage

# What a Mage can wear and wield. Proficiencies as in Classic: Forever's own data doesn't
# list proficiencies, so correct anything here that Forever changed.
# Values match Forever Companion's item details (weaponType, armor class).
rules:
  weapon_types: [Dagger, Sword, Staff, Wand]
  armor_types: [cloth]
  plate_from_level: null
  mail_from_level: null
  # Staves are the only two-handers a Mage can use.
  two_handers: true
  two_hand_types: [Staff]
  # Held-in-off-hand items only.
  off_hand_types: [Miscellaneous]

# Stat weights: rough starting points, not theorycraft. Adjust them in the app.
# Stat names are as Forever writes them, including equip bonuses ("Equip: +5 Spell Power").
# The first preset is the default; the others only list what they change.
presets:
  - key: mage-leveling
    name: Leveling caster
    weights:
      Spell Damage: 1.0
      Spell Power: 1.0
      Frost Spell Damage: 0.8
      Fire Spell Damage: 0.6
      Arcane Spell Damage: 0.3
      Intellect: 0.7
      Stamina: 0.5
      Spirit: 0.3
      Mana Regeneration: 0.6
      Health Regeneration: 0.0
      # Mages wand less than Warlocks and Priests, but it still finishes pulls.
      Ranged DPS: 0.5
      Weapon DPS: 0.0
      Armor: 0.02
      Strength: 0.0
      Agility: 0.0
      Attack Power: 0.0
      Healing: 0.0
      Fire Resistance: 0.05
      Frost Resistance: 0.05
      Nature Resistance: 0.05
      Shadow Resistance: 0.05
      Arcane Resistance: 0.05
  - key: mage-dungeon
    name: Dungeon caster
    weights:
      Fire Spell Damage: 0.8
      Intellect: 0.6
      Stamina: 0.4
      Spirit: 0.1
      Ranged DPS: 0.2

# No curated gear targets or talent plan yet: build them in the app's editors.
targets: []
