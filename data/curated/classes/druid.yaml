# Druid defaults (#80, ADR 0023): used when the synced character is a Druid, and in
# guest mode. Edits made in the app (Upgrades settings, Stat weights, Edit targets, the
# talent planner) are saved in the database and win until reset.

name: Druid

# What a Druid can wear and wield. Proficiencies as in Classic: Forever's own data
# doesn't list proficiencies, so correct anything here that Forever changed.
# Values match Forever Companion's item details (weaponType, armor class).
rules:
  weapon_types: [Dagger, Fist Weapon, Mace, Staff]
  armor_types: [cloth, leather]
  plate_from_level: null
  mail_from_level: null
  # Two-handed maces and staves.
  two_handers: true
  two_hand_types: [Mace, Staff]
  # Held-in-off-hand items only.
  off_hand_types: [Miscellaneous]

# Stat weights: rough starting points, not theorycraft. Adjust them in the app.
# Stat names are as Forever writes them, including equip bonuses ("Equip: +5 Spell Power").
# The first preset is the default; the others only list what they change.
presets:
  # Cat form: weapon damage doesn't count in forms, so stats lead.
  - key: druid-leveling
    name: Leveling feral
    weights:
      Agility: 1.0
      Strength: 1.0
      Attack Power: 0.5
      Stamina: 0.6
      Intellect: 0.2
      Spirit: 0.2
      Armor: 0.05
      Defense: 0.1
      Weapon DPS: 0.0
      Ranged DPS: 0.0
      Spell Damage: 0.0
      Spell Power: 0.0
      Nature Spell Damage: 0.0
      Arcane Spell Damage: 0.0
      Healing: 0.0
      Mana Regeneration: 0.1
      Fire Resistance: 0.05
      Frost Resistance: 0.05
      Nature Resistance: 0.05
      Shadow Resistance: 0.05
      Arcane Resistance: 0.05
  # Bear form: armor counts several times over.
  - key: druid-tank
    name: Dungeon tank
    weights:
      Stamina: 1.0
      Armor: 0.15
      Agility: 0.7
      Strength: 0.5
      Defense: 1.0
      Attack Power: 0.25
      Intellect: 0.0
      Spirit: 0.0
      Mana Regeneration: 0.0
  - key: druid-healer
    name: Dungeon healer
    weights:
      Healing: 1.0
      Spell Power: 0.8
      Spell Damage: 0.1
      Intellect: 0.7
      Spirit: 0.6
      Mana Regeneration: 1.0
      Stamina: 0.3
      Agility: 0.0
      Strength: 0.0
      Attack Power: 0.0
      Armor: 0.02
      Defense: 0.0

# No curated gear targets or talent plan yet: build them in the app's editors.
targets: []
