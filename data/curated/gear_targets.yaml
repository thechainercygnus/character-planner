# Gear targets, Alliance Protection Warrior: one list, grouped by slot (ADR 0015).
# The default: targets edited in the app (Plan tab > Edit targets, or Make target on the
# Upgrades tab) are saved in the database and win until Reset (ADR 0014).
# Source: Timesaver's WoW Forever leveling gear list
# https://timesaver.gg/tools/wow-forever/leveling-gear/warrior/protection
# Copied from the Leveling Playbook doc; update both until the playbook moves into the repo.
#
# The Plan tab shows, per slot, the target you can go for now and the ones coming up.
# level: not before this level, i.e. when you plan to go for it. The item's own level
# (required level, else its quest or dungeon level) wins when it's higher or level is left
# out. The levels below are the guide's brackets (15 and 20).
# Within a slot, list order is priority among targets at the same level.
#
# slot values are Battle.net equipment slot types (HEAD, NECK, OFF_HAND, FINGER_1...).
#
# Item data comes from Battle.net item search by name (ADR 0003) and from Forever Companion
# by item_id (ADR 0004). item_id is the reliable key: find it with
#   uv run character-planner-probe-companion --ids <id or range>
# or in the item's Wowhead URL (wowhead.com/forever/item=<id>).
# Forever-new items (Hall of Thanes drops) aren't in that search, so add what you know by
# hand from Wowhead or ForeverDB; every field is optional:
#   {slot: WAIST, item: Kindlegem Girdle, source: "...", level: 15, item_level: 22,
#    armor_type: Mail, armor: 120, stats: {Stamina: 5, Strength: 3}}

