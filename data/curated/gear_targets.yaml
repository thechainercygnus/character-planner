# Gear targets per level bracket, Alliance Protection Warrior.
# Source: Timesaver's WoW Forever leveling gear list
# https://timesaver.gg/tools/wow-forever/leveling-gear/warrior/protection
# Copied from the Leveling Playbook doc; update both until the playbook moves into the repo.
#
# slot values are Battle.net equipment slot types (HEAD, NECK, OFF_HAND, FINGER_1...).
#
# Item level, armor type and icon come from Battle.net item search by name (ADR 0003).
# Forever-new items (Hall of Thanes drops) aren't in that search, so add what you know by
# hand from Wowhead or ForeverDB; every field is optional:
#   {slot: WAIST, item: Kindlegem Girdle, source: "...", item_level: 22, armor_type: Mail,
#    armor: 120, stats: {Stamina: 5, Strength: 3}}

brackets:
  - min_level: 15
    targets:
      - {slot: OFF_HAND, item: Dwarven Defender, source: "Quest: In Defense of the King's Lands (Loch Modan)", priority: 1}
      - {slot: WAIST, item: Kindlegem Girdle, source: "Hall of Thanes - Magmatus", priority: 2}
      - {slot: LEGS, item: Direhammer Leggings, source: "Hall of Thanes - Durgen Dirgehammer", priority: 3}
      - {slot: WRIST, item: Cryptwalker Bracers, source: "Quest: The Restless Dead (Hall of Thanes)", priority: 4}
      - {slot: HANDS, item: Flamefist Grips, source: "Hall of Thanes - Magmatus", priority: 5}
      - {slot: MAIN_HAND, item: "Durgen's Crescent Axe", source: "Hall of Thanes - Durgen Dirgehammer", priority: 6}
      - {slot: RANGED, item: Calibrated Blunderbuss, source: "Quest: Old Ironforge Incursion (Hall of Thanes)", priority: 7}
      - {slot: CHEST, item: Golemguard Chest, source: "Hall of Thanes - Plunder", priority: 8}
      - {slot: FEET, item: Treads of the Protector Golem, source: "Hall of Thanes - Plunder", priority: 9}
      - {slot: BACK, item: Spiritwraith Drape, source: "Hall of Thanes - Faldrim Anvilmar", priority: 10}

  - min_level: 20
    targets:
      - {slot: HEAD, item: "Guard's Silvered Chain Helm", source: "Crafted: Blacksmithing (AH)"}
      - {slot: NECK, item: Tarnished Locket, source: "Quest: Remember That I Love You (Riverglades)"}
      - {slot: SHOULDER, item: Durable Chain Shoulders, source: "Quest: WANTED: Chok'sul (Loch Modan)"}
      - {slot: BACK, item: Cape of the Brotherhood, source: "Deadmines - Edwin VanCleef"}
      - {slot: CHEST, item: Tunic of Westfall, source: "Quest: The Defias Brotherhood (Deadmines)"}
      - {slot: WRIST, item: Bandsaw Wristbands, source: "Deadmines - Sneed"}
      - {slot: HANDS, item: Gloves of the Fang, source: "Wailing Caverns - Druid of the Fang"}
      - {slot: WAIST, item: "Cobrahn's Grasp", source: "Wailing Caverns - Lord Cobrahn"}
      - {slot: LEGS, item: Leggings of the Fang, source: "Wailing Caverns - Lord Cobrahn"}
      - {slot: FEET, item: Footpads of the Fang, source: "Wailing Caverns - Lord Serpentis"}
      - {slot: FINGER_1, item: First Mate Band, source: "Deadmines - Mr. Smite"}
      - {slot: FINGER_2, item: "Slain Baron's Signet", source: "Quest: Abominable Creatures (Ruins of Lordaeron)"}
      - {slot: MAIN_HAND, item: "Butcher's Cleaver", source: "Shadowfang Keep - Razorclaw the Butcher"}
      - {slot: OFF_HAND, item: "Kresh's Back", source: "Wailing Caverns - Kresh"}
      - {slot: RANGED, item: Dull Sawblade, source: "Deadmines - Sneed's Shredder"}
