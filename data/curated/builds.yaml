# The Warrior's builds (#216, ADR 0060): what a character is for, as one choice. Each sets a
# stat-weight preset (stat_weights.yaml, weight_presets.yaml), a role for the guild view and,
# here, a talent order. Other classes list theirs in classes/<class>.yaml.
#
# The talent orders are DRAFTS by Claude from classic-era practice, fitted to Forever's own
# trees (#88: Vanguard, Bastion and the rest are Forever's): each passes the planner's tree
# rules (5 points per row, prerequisites maxed first, 51 points by level 60). Bryce reviews
# them; Forever's talents may play differently from their names.
#
# A step raises a talent to a rank, one point per level from 10. The Protection order starts
# with the 9 points the synced character spent at level 18 (talent_plan.yaml).

protection_talents: &protection
  spec: Protection
  steps:
    - {talent: Shield Specialization, talent_id: 135507, rank: 5}
    - {talent: Anticipation, talent_id: 135506, rank: 1}
    - {talent: Improved Revenge, talent_id: 135500, rank: 3}
    - {talent: Anticipation, talent_id: 135506, rank: 5}
