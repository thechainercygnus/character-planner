# Profession ranks (#10, ADR 0031): what each trainer rank allows and when it can be
# trained. Neither Blizzard nor Forever Companion publishes these, so they're Classic's
# values; edit them here if Forever changes them.
#
# max_skill: the skill cap the rank gives.
# train_at_skill / train_at_level: when a trainer teaches it.
# Every profession, primary or secondary, uses the same ranks. Some secondary ranks need a
# book or a quest rather than a trainer; `note` says so where it's known to differ.
ranks:
  - name: Apprentice
    max_skill: 75
    train_at_skill: 0
    train_at_level: 5
  - name: Journeyman
    max_skill: 150
    train_at_skill: 50
    train_at_level: 10
  - name: Expert
    max_skill: 225
    train_at_skill: 125
    train_at_level: 20
  - name: Artisan
    max_skill: 300
    train_at_skill: 200
    train_at_level: 35

notes:
  First Aid: Expert comes from a book sold in Arathi Highlands and Dustwallow Marsh; Artisan from a quest.
  Cooking: Expert comes from a book; Artisan from a quest in Tanaris.
  Fishing: Expert comes from a book; Artisan from a quest in Dustwallow Marsh.
