[project]
name = "character-planner"
version = "0.2.2"
description = "Character growth planner for a WoW Forever character, backed by the Battle.net API."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "alembic>=1.14",
]

[project.scripts]
character-planner-spike = "character_planner.spike:main"
character-planner-probe-items = "character_planner.probe_items:main"
character-planner-probe-companion = "character_planner.probe_companion:main"
character-planner-pool = "character_planner.pool_cli:main"
character-planner-probe-recipes = "character_planner.probe_recipes:main"
character-planner-worker = "character_planner.worker:main"
character-planner-db = "character_planner.dbcli:main"
character-planner-api-docs = "character_planner.api_reference:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.16",
    "pyright>=1.1.414",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
    "pytest-cov>=7",
    "httpx2>=2.16.0",
]
docs = ["furo>=2025.12.19", "myst-parser>=5.2.0", "sphinx>=9.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/character_planner"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "S",   # bandit (security)
    "RUF",
]
ignore = ["S101"] # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # fake secrets in tests

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
# The package is checked strictly (#85, OpenSSF Silver's warnings_strict); the tests stay
# on standard, where most strict findings are unknown types from JSON fixtures.
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# Every warning fails the run (#85, OpenSSF Silver's warnings_strict). Ignore one only
# when it comes from a dependency and can't be fixed here, with a comment saying why.
filterwarnings = ["error"]

# Coverage (#55): line and branch coverage of the package. CI runs
# `pytest --cov --cov-report=term --cov-report=xml`; locally, add `--cov` to see it.
# The floor (#94) is the measured total, rounded down: a PR that lowers coverage fails.
# Raise it as coverage grows. CI also checks OpenSSF Silver's 80% of statements.
[tool.coverage.run]
source = ["src/character_planner"]
branch = true

[tool.coverage.report]
skip_empty = true
precision = 1
fail_under = 91   # statements and branches together; 91.4% on 2026-11-13
