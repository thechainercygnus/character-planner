[project]
name = "character-planner"
version = "0.1.0"
description = "Character growth planner for a WoW Forever character, backed by the Battle.net API."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
character-planner-spike = "character_planner.spike:main"
character-planner-probe-items = "character_planner.probe_items:main"
character-planner-probe-companion = "character_planner.probe_companion:main"
character-planner-pool = "character_planner.pool_cli:main"
character-planner-probe-recipes = "character_planner.probe_recipes:main"
character-planner-worker = "character_planner.worker:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.16",
    "pyright>=1.1.414",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/character_planner"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "S",   # bandit (security)
    "RUF",
]
ignore = ["S101"] # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"] # fake secrets in tests

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
