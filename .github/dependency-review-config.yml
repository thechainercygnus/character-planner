# Dependency Review (#53): checks the dependencies a pull request adds or changes.
#
# Vulnerabilities: fail on known high or critical ones.
fail-on-severity: high

# Licenses: the project is AGPL-3.0-or-later (#59), so new dependencies must be under a
# license that can be combined with it. Every current dependency's license is here (MIT,
# Apache-2.0, MPL-2.0, BSD, ISC, 0BSD, BlueOak, PSF), plus the other common compatible
# ones. GPL-2.0-only and non-free licenses are deliberately absent. A dependency whose
# license is unknown is reported, not failed: check it by hand.
allow-licenses:
  - MIT
  - MIT-0
  - Apache-2.0
  - MPL-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - 0BSD
  - BlueOak-1.0.0
  - PSF-2.0
  - Python-2.0
  - Zlib
  - Unlicense
  - CC0-1.0
  - LGPL-2.1-or-later
  - LGPL-3.0-only
  - LGPL-3.0-or-later
  - GPL-3.0-only
  - GPL-3.0-or-later
  - AGPL-3.0-only
  - AGPL-3.0-or-later

# Reviewed by hand, exempt from the list above (any license passes for these only):
# - docutils (#104, needed by Sphinx for the docs site). The scanner joins every license
#   found in its source into one expression, including GPL-1.0-or-later, CC-PDDC and
#   LicenseRef-scancode-* terms. Per docutils.sourceforge.io/COPYING.html: public domain
#   for most of it, BSD-2-Clause (and SmartyPants' BSD-3-Clause) for some files, and
#   GPL-3.0-or-later for its Emacs mode; "All used licenses are OSI-approved and
#   GPL-compatible." It's a docs build tool only, not in the image.
allow-dependencies-licenses:
  - pkg:pypi/docutils
