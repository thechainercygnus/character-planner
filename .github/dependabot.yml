# Dependabot version updates (#50). Security updates and alerts are on in the repo
# settings; this file adds weekly version updates for every dependency source.
#
# Minor and patch updates are grouped into one PR per ecosystem a week, so the PR
# count stays small; major updates come one PR each, since they can need changes.
# CI runs on every PR, and the "Protect main" ruleset needs it green before a merge.
version: 2

updates:
  # Python: pyproject.toml and uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  # Frontend: frontend/package.json and package-lock.json
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # Actions used in .github/workflows/. Once #52 pins them to commit SHAs, Dependabot
  # updates the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # Dockerfile base images (node, python, the uv image).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Runtime upgrades are deliberate, made with CI and the dev setup: no Node majors
    # (odd ones never get LTS) and no Python minors (3.14 to 3.15) from here.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
