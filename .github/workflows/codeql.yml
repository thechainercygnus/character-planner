# CodeQL code scanning, advanced setup (#51): versioned here rather than GitHub's default
# setup, which must stay off (the two conflict). Results go to Security > Code scanning.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so new queries also look at code that hasn't changed.
  schedule:
    - cron: "41 5 * * 2"

permissions: {}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # actions scans the workflows themselves (injection, permissions, pinning).
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # Python and JS/TS are interpreted, and workflows are YAML: nothing to build.
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
