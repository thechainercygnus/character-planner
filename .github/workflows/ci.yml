name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (#52): read-only by default; a job that needs more says so itself.
# Actions are pinned to commit SHAs with the version in a comment; Dependabot updates both.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      # Coverage (#55): fails below the floor in pyproject.toml (#94).
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      # Shown even when the floor fails the step above; fails on its own below OpenSSF
      # Silver's 80% of statements (#94).
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        run: |
          uv run python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          lines, branches = float(root.get("line-rate")), float(root.get("branch-rate"))
          print("### Backend coverage")
          print()
          print(f"Statements **{lines:.1%}**, branches **{branches:.1%}**.")
          print()
          if lines < 0.80:
              print("**Below OpenSSF Silver's 80% of statements.**")
              raise SystemExit(1)
          EOF
          {
            echo "<details><summary>Per file</summary>"
            echo
            uv run coverage report --format=markdown
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists a pull request's commits to scan them; without this it
      # fails on every PR with "Resource not accessible by integration".
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The docs site (#104), built as Read the Docs builds it: warnings are errors, so a
  # broken link or reference fails the PR rather than the published site.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked --group docs
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Tests with coverage (#55): fails below the floors in vitest.config.ts (#94).
      - run: npm run coverage
      - if: ${{ !cancelled() && hashFiles('frontend/coverage/coverage-summary.json') != '' }}
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() && hashFiles('frontend/coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 14
      - run: npm run build
      # The bundle is reproducible (OpenSSF build_repeatable, #86): a second clean build
      # must give the same bytes, file for file.
      - name: Reproducible build
        run: |
          (cd dist && find . -type f -exec sha256sum {} + | sort -k2) > ../first.sha256
          rm -rf dist node_modules/.vite node_modules/.tmp
          npm run build
          (cd dist && find . -type f -exec sha256sum {} + | sort -k2) | diff ../first.sha256 -

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t character-planner:ci .
      - name: Smoke test the API, the built frontend and the worker
        run: |
          docker run -d --name planner -p 8000:8000 character-planner:ci
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/api/healthz
          curl -fs http://127.0.0.1:8000/ | grep -q 'id="root"'
          docker run --rm character-planner:ci character-planner-worker --once
      - if: failure()
        run: docker logs planner