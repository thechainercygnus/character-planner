name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks-action lists a pull request's commits to scan them; without this the
  # secret-scan job fails on every PR with "Resource not accessible by integration".
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t character-planner:ci .
      - name: Smoke test the API, the built frontend and the worker
        run: |
          docker run -d --name planner -p 8000:8000 character-planner:ci
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/api/healthz
          curl -fs http://127.0.0.1:8000/ | grep -q 'id="root"'
          docker run --rm character-planner:ci character-planner-worker --once
      - if: failure()
        run: docker logs planner