name: release

# A release (#61, ADR 0026): pushing a tag vX.Y.Z that matches pyproject.toml's version (or a
# test release, vX.Y.Z-rc.N)
# publishes the image to GHCR for amd64 and arm64, scanned, with an SBOM, build
# provenance and a cosign signature, then creates the GitHub release with notes.
# See docs/releasing.md.
on:
  push:
    tags: ["v*"]

# Least privilege (#52): read-only by default; each job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # keyless signing and provenance (Sigstore)
      attestations: write # build provenance
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The tag matches the version in pyproject.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          # vX.Y.Z, or a test release of it: vX.Y.Z-rc.N (docs/releasing.md).
          case "${TAG}" in
            "v${version}" | "v${version}"-rc.[0-9]*) ;;
            *)
              echo "::error::Tag ${TAG} doesn't match pyproject.toml's version ${version} (or ${version}-rc.N)"
              exit 1
              ;;
          esac

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # 1.2.3, 1.2 and latest. A test release (1.2.3-rc.1) gets only its own tag:
          # metadata-action skips {{major}}.{{minor}} for pre-releases, and latest is
          # set explicitly here rather than left to its default.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ !contains(github.ref_name, '-') }}

      # Scan before publishing: a vulnerable image never reaches GHCR. Built for amd64 and
      # loaded locally; the published build reuses its layers from this job's builder (no
      # shared cache, so nothing from another run can reach a release).
      - name: Build for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: character-planner:scan

      - name: Scan the image (fixable high and critical vulnerabilities fail the release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: character-planner:scan
          version: v0.70.0
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Build and push for amd64 and arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance comes from attest-build-provenance below, not BuildKit's own.
          provenance: false

      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: character-planner.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: character-planner.cdx.json
          retention-days: 7

  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      pull-requests: read # read PR labels for the Security section
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous tag, for the notes
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - name: Notes and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          .github/scripts/release-notes.sh "${TAG}" "${IMAGE}" "${DIGEST}" > notes.md
          cat notes.md
          prerelease=""
          case "${TAG}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file notes.md \
            ${prerelease} character-planner.cdx.json
