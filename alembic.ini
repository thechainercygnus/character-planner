# Alembic's command line, for developers (ADR 0022). The app migrates itself at startup.
#
#   uv run alembic revision --autogenerate -m "Describe the change"
#   uv run alembic upgrade head
#   uv run alembic current
#
# The database comes from DATABASE_URL in the settings (.env), not from this file.

[alembic]
script_location = %(here)s/src/character_planner/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
